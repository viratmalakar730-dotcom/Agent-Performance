<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Dashboard</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>


<h2>📊 Agent Performance Dashboard</h2>

<div id="reportTime"></div>

<div id="cards"></div>

<div class="live-report-toolbar">
  <input type="text" id="search" placeholder="🔍 Search Agent Full Name..." onkeyup="searchTable()">
  <div id="bhopalClock" aria-live="off" title="Live Bhopal, Madhya Pradesh time"></div>
</div>

<div class="table-container">
<table id="table">
<thead>
<tr>
<th>S.No</th>
<th>Employee ID</th>
<th>Agent Full Name</th>
<th>Total Login</th>
<th>Net Login</th>
<th>Total Break</th>
<th>Total Meeting</th>
<th>Total ACW</th>
<th>AHT</th>
<th>Total Mature</th>
<th>IB Mature</th>
<th>OB Mature</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div id="brandingLive">Powered by Chandan Malakar</div>

<audio id="notifySound"></audio>

<div id="liveAlert">🚀 Agent Performance Report Updated</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="./script.js"></script>
<script>
(function () {
  const clock = document.getElementById("bhopalClock");
  if (!clock) return;
  const formatter = new Intl.DateTimeFormat("en-IN", {
    timeZone: "Asia/Kolkata",
    day: "2-digit", month: "short", year: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: true
  });
  function updateBhopalClock() {
    const parts = Object.fromEntries(formatter.formatToParts(new Date()).map(p => [p.type, p.value]));
    clock.textContent = `${parts.day}-${parts.month}-${parts.year} ${parts.hour}:${parts.minute}:${parts.second} ${parts.dayPeriod.toUpperCase()}`;
  }
  updateBhopalClock();
  setInterval(updateBhopalClock, 1000);
})();
</script>

</body>
</html>
